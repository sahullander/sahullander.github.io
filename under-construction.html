<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Under Construction | Steven Hullander</title>

<style>
:root {
  --bg: #0e1117;
  --fg: #e6edf3;
  --muted: #9da7b3;
  --accent: #58a6ff;
  --accent2: #ff6e58;
  --card: #161b22;
  --border: #222;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 520px;
  padding: 2.5rem 2rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.45);
}

.icon {
  font-size: 2.6rem;
  margin-bottom: 0.8rem;
}

h1 {
  margin: 0.2rem 0 0.6rem;
  font-size: 1.9rem;
}

p {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.6;
}

.highlight {
  color: var(--accent2);
}

.actions {
  margin-top: 1.6rem;
}

.actions a {
  display: inline-block;
  padding: 0.55rem 1.1rem;
  border-radius: 8px;
  background: linear-gradient(
    135deg,
    rgba(88,166,255,0.15),
    rgba(255,110,88,0.15)
  );
  border: 1px solid var(--border);
  color: var(--fg);
  text-decoration: none;
  font-weight: 500;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.actions a:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}
</style>
</head>

<body>

  <div class="container">
    <div class="icon">🚧</div>

    <h1>Under Construction</h1>

    <p>
      This page is currently <span class="highlight">being built</span> or refined.
      I’m actively working on content, tooling, or write-ups here — check back soon.
    </p>

    <div class="actions">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

</body>
</html>
